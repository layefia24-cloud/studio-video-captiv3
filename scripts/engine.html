<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<title>Face-cam motion engine</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
/* =====================================================================
   FACE-CAM MOTION ENGINE
   Draws one frame of a vertical face-cam video with motion design on top,
   from a JSON config (see example-config.json). render.mjs calls seek(t).
   Scene types : face (styles plain|signature|editorial|violet|neon),
                 cutaway, cards (checklist|nodes|counter|product|chat|
                 persona|compare|steps), pip, split, end.
   + short.js : short, stage, post, timeline, annot, profile (lookbook).
   ===================================================================== */
const Q=new URLSearchParams(location.search);
const CFG_URL=Q.get('config')||'config.json';
let C,W,H,u,x,WORDS=[],GROUPS=[];
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),rp=(t,a,b)=>cl((t-a)/(b-a)),eo=v=>1-Math.pow(1-cl(v),3);
const back=v=>{v=cl(v);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(v-1,3)+c1*Math.pow(v-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const pad=n=>String(n).padStart(4,'0');
function rr(X,Y,w,h,r){x.beginPath();x.roundRect(X,Y,w,h,r)}

/* ---------- image cache ---------- */
const CACHE=new Map();
function load(src){if(!src)return Promise.resolve(null);if(!/^(\/|https?:|data:|blob:)/.test(src))src='/'+src;if(CACHE.has(src))return CACHE.get(src);const p=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});CACHE.set(src,p);if(CACHE.size>400){const k=CACHE.keys().next().value;CACHE.delete(k)}return p}
function srcIdx(t,sc){const s=C.source;const off=(sc&&sc.srcOffset!=null)?sc.srcOffset:(s.offset||0);return Math.max(0,Math.min((s.count||99999)-1,Math.floor((t+off)*(s.fps||30))))}
async function faceAt(t,sc){const s=C.source;const i=srcIdx(t,sc);const dir=(sc&&sc.frames)||s.frames,mdir=(sc&&sc.masks)||s.masks;const [f,m]=await Promise.all([load(`${dir}/${pad(i+1)}.jpg`),mdir?load(`${mdir}/${pad(i+1)}.png`):null]);return {f,m}}

/* ---------- drawing helpers ---------- */
function cover(im,X,Y,w,h,fy=.45,z=1){if(!im)return;const s=Math.max(w/im.width,h/im.height)*z,iw=im.width*s,ih=im.height*s;x.drawImage(im,X+(w-iw)/2,Y+(h-ih)*fy,iw,ih)}
let PC=null;
function cutout(f,m,fy){if(!f||!m)return;if(!PC){PC=document.createElement('canvas');PC.width=W;PC.height=H}const q=PC.getContext('2d');q.globalCompositeOperation='source-over';q.clearRect(0,0,W,H);
 const s=Math.max(W/m.width,H/m.height),iw=m.width*s,ih=m.height*s;q.drawImage(m,(W-iw)/2,(H-ih)*fy,iw,ih);q.globalCompositeOperation='source-in';const s2=Math.max(W/f.width,H/f.height),fw=f.width*s2,fh=f.height*s2;q.drawImage(f,(W-fw)/2,(H-fh)*fy,fw,fh);q.globalCompositeOperation='source-over';x.drawImage(PC,0,0)}
function word(s,X,Y,size,o={}){if(!s)return;x.save();x.translate(X,Y);if(o.rot)x.rotate(o.rot);if(o.sc!=null)x.scale(o.sc,o.sc);x.font=`${o.it?'italic ':''}${o.w||800} ${size}px ${o.f||C.brand.font}`;x.textAlign=o.al||'center';x.textBaseline='middle';x.letterSpacing=(o.ls||0)+'px';
 let w=x.measureText(s).width;if(o.max&&w>o.max){const k=o.max/w;x.scale(k,k);w=o.max/k}
 if(o.grad){const g=x.createLinearGradient(-w/2,0,w/2,0);o.grad.forEach((c,i)=>g.addColorStop(i/(o.grad.length-1),c));x.fillStyle=g}else x.fillStyle=o.col||'#fff';
 x.globalAlpha*=o.a??1;if(o.stroke){x.lineWidth=o.stroke[0];x.strokeStyle=o.stroke[1];x.lineJoin='round';x.strokeText(s,0,0)}
 if(o.glow){x.shadowColor=o.glow;x.shadowBlur=size*.5;x.fillText(s,0,0)}if(o.sh){x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=size*.3;x.shadowOffsetY=size*.05}x.fillText(s,0,0);x.restore()}
function photo(im,X,Y,w,h,rot,k,border=true){if(!im||k<=0)return;x.save();x.translate(X,Y);x.rotate(rot||0);x.scale(.6+.4*k,.6+.4*k);x.globalAlpha=cl(k);x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=w*.15;x.shadowOffsetY=w*.05;if(border){x.fillStyle='#fff';rr(-w/2-w*.04,-h/2-w*.04,w*1.08,h+w*.08,w*.06);x.fill()}x.shadowColor='transparent';rr(-w/2,-h/2,w,h,w*.04);x.clip();cover(im,-w/2,-h/2,w,h,.5);x.restore()}
function vignette(a=.5,from=.6){const g=x.createLinearGradient(0,H*from,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);x.fillStyle=g;x.fillRect(0,H*from,W,H*(1-from))}
function hideBurned(y,h){if(y==null)return;const Y=H*y,hh=H*(h||.06);x.save();x.beginPath();x.ellipse(W/2,Y,W*.36,hh*.62,0,0,7);x.clip();x.filter='blur(16px)';x.drawImage(x.canvas,0,0);x.filter='none';x.restore();
 x.save();x.translate(W/2,Y);x.scale(1,hh/(W*.6));const g=x.createRadialGradient(0,0,0,0,0,W*.42);g.addColorStop(0,'rgba(0,0,0,.4)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(0,0,W*.42,0,7);x.fill();x.restore()}
function card(X,Y,w,h,k,o={}){if(k<=0)return false;x.save();x.globalAlpha*=cl(k);x.translate(X+w/2,Y+h/2+(1-eo(k))*u*6);const s=.92+.08*back(k);x.scale(s,s);x.shadowColor='rgba(20,40,30,.18)';x.shadowBlur=u*5;x.shadowOffsetY=u*1.2;x.fillStyle=o.fill||'#fff';rr(-w/2,-h/2,w,h,o.r??u*3.4);x.fill();x.shadowColor='transparent';if(o.stroke){x.strokeStyle=o.stroke;x.lineWidth=u*.4;x.stroke()}return true}
function endCard(){x.restore()}
function pill(s,X,Y,size,bg,fg,k=1){if(k<=0)return;x.save();x.globalAlpha*=cl(k);x.font=`800 ${size}px ${C.brand.font}`;const w=x.measureText(s).width+size*1.6,h=size*1.9;x.fillStyle=bg;rr(X-w/2,Y-h/2,w,h,h/2);x.fill();x.restore();word(s,X,Y,size,{w:800,col:fg,a:cl(k)})}
function check(X,Y,r,col,k){if(k<=0)return;x.save();x.globalAlpha*=cl(k);x.fillStyle=col;x.beginPath();x.arc(X,Y,r,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=r*.28;x.lineCap='round';x.beginPath();x.moveTo(X-r*.42,Y);x.lineTo(X-r*.1,Y+r*.32);x.lineTo(X+r*.45,Y-r*.35);x.stroke();x.restore()}
function avatar(X,Y,r,col){x.save();x.fillStyle='#fff';x.strokeStyle=col;x.lineWidth=r*.12;x.beginPath();x.arc(X,Y,r,0,7);x.fill();x.stroke();x.fillStyle=col;x.beginPath();x.arc(X,Y-r*.22,r*.28,0,7);x.fill();x.beginPath();x.ellipse(X,Y+r*.42,r*.48,r*.3,0,Math.PI,0);x.fill();x.restore()}
function bg(kind){const B=C.brand;if(kind=='dark'){x.fillStyle=B.dark;x.fillRect(0,0,W,H);const g=x.createRadialGradient(W*.5,H*.35,0,W*.5,H*.35,H*.7);g.addColorStop(0,'rgba(255,255,255,.08)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
 else{x.fillStyle=B.light;x.fillRect(0,0,W,H);const g=x.createRadialGradient(W*.2,H*.12,0,W*.2,H*.12,W*.9);g.addColorStop(0,B.primary+'26');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.06;x.strokeStyle=B.dark;x.lineWidth=1;for(let i=0;i<W;i+=u*9){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<H;j+=u*9){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}x.restore()}}

/* ---------- captions (karaoke, 1 à 3 mots) ---------- */
function mkGroups(){GROUPS=[];let cur=[];for(let i=0;i<WORDS.length;i++){cur.push(i);const w=WORDS[i][0],end=/[.?!…:,]$/.test(w),gap=i+1<WORDS.length?WORDS[i+1][1]-WORDS[i][2]:1;if(cur.length>=(C.captions.maxWords||3)||end||gap>.35){GROUPS.push(cur);cur=[]}}if(cur.length)GROUPS.push(cur)}
function captions(t,sc){if(!C.captions||!C.captions.on||sc.captions===false||!WORDS.length)return;let gi=-1;for(let i=0;i<GROUPS.length;i++){const st=WORDS[GROUPS[i][0]][1]-.05,nx=i+1<GROUPS.length?WORDS[GROUPS[i+1][0]][1]-.05:1e9,en=Math.min(nx,WORDS[GROUPS[i].at(-1)][2]+.6);if(t>=st&&t<en)gi=i}if(gi<0)return;
 const g=GROUPS[gi],Y=H*(sc.capY||C.captions.y||.72),hl=(sc.hl||[]).map(s=>s.toLowerCase()),B=C.brand;const age=t-(WORDS[g[0]][1]-.05),k=back(cl(age/.18));
 const ws=g.map(i=>WORDS[i][0].replace(/[,.…:]$/,''));const thn=sc.theme||C.theme;const lite=(sc.type=='cards'&&(sc.bg||'light')=='light')||sc.type=='pip'||(['kinetic','graph','bento','avatar','object','phoneui','cta'].includes(sc.type)&&!['dark','pub','tech'].includes(thn));const tc=lite?B.dark:'#fff';const key=ws.findIndex(w=>hl.includes(w.toLowerCase().replace(/[^\p{L}\p{N}']/gu,'')));
 if(key>=0){const small=ws.filter((_,j)=>j!=key).join(' ');if(small)word(small,W/2,Y-u*7.5,u*5,{w:600,col:tc,sh:!lite,a:cl(age/.1)});word(ws[key],W/2,Y+u*1.5,u*11,{w:900,col:sc.type=='face'?B.primary:TH(sc).acc,stroke:[u*.9,'#fff'],sh:!lite,sc:k,max:W*.9})}
 else{const st=ws.join(' ');word(st,W/2,Y,u*6.8,{w:800,col:tc,sh:!lite,sc:.9+.1*k,max:W*.9})}}

/* ---------- FACE styles ---------- */
const GR=()=>C.brand.grad||['#ffb36b','#ff5e7e','#c77dff'];
async function sceneFace(t,lt,sc){const {f,m}=await faceAt(t,sc);const fy=sc.fy??.45;const st=sc.style||'plain';
 x.save();if(sc.punch){const z=1+.06*eo(rp(lt,0,.25));x.translate(W/2,H*.4);x.scale(z,z);x.translate(-W/2,-H*.4)}cover(f,0,0,W,H,fy);x.restore();
 const Y=H*(sc.wy||.8);
 if(st=='neon'){x.fillStyle='rgba(0,0,0,.35)';x.fillRect(0,0,W,H)}
 if(st=='signature'){x.save();x.globalCompositeOperation='screen';const r=x.createRadialGradient(W/2,H*.7,0,W/2,H*.7,W*.8);r.addColorStop(0,`rgba(255,110,50,${.5*eo(rp(lt,0,.25))})`);r.addColorStop(1,'rgba(255,60,0,0)');x.fillStyle=r;x.fillRect(0,0,W,H);x.restore()}
 // behind-person layer
 if(sc.ghost&&lt>=(sc.ghostAt||0)){const k=eo(rp(lt,sc.ghostAt||0,(sc.ghostAt||0)+.25));word(sc.ghost,W/2,H*.2,u*26,{w:900,it:st!='editorial',grad:st=='editorial'?['#ff7a18','#ffd400']:['#ff8a3d','#ff3d7f'],a:k,sc:.85+.15*k,max:W*.96})}
 if(sc.vertical&&lt>=(sc.verticalAt||0)){const k=eo(rp(lt,sc.verticalAt||0,(sc.verticalAt||0)+.25)),L=[...sc.vertical];x.save();x.globalAlpha=k;L.forEach((ch,j)=>word(ch,W*(sc.vx||.18),H*.12+j*H*(.6/L.length)+(1-k)*u*10,u*34,{w:900,grad:['#ff7a18','#ffd400']}));x.restore()}
 if(sc.ring){const imgs=await Promise.all(sc.ring.map(load));const t0=sc.ringAt||0;if(lt>=t0){const k=eo(rp(lt,t0,t0+.3)),R=W*.43*(.7+.3*k);imgs.forEach((im,j)=>{const n=imgs.length,a=-Math.PI*.96+j*(Math.PI*.92/Math.max(1,n-1))+(lt-t0)*.3;photo(im,W/2+Math.cos(a)*R,H*.3+Math.sin(a)*R*.75,u*19,u*24,a+Math.PI/2,k*rp(lt,t0+j*.03,t0+j*.03+.2))})}}
 if(sc.ghost||sc.vertical||sc.ring)cutout(f,m,fy);
 if(sc.floats){const imgs=await Promise.all(sc.floats.map(p=>load(p.src)));sc.floats.forEach((p,j)=>{const t0=p.at||0;if(lt<t0)return;const L=p.side=='l';photo(imgs[j],L?W*(p.x||.22):W*(1-(p.x||.22)),H*(p.y||.2)+Math.sin(lt*3)*u,u*(p.w||26),u*(p.w||26)*1.27,(L?-1:1)*.1,back(rp(lt,t0,t0+.3)))})}
 if(st=='violet'){const k=eo(rp(lt,0,.3));x.save();x.lineCap='round';const arc=(cx,cy,R,a0,a1,w)=>{const g=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R);g.addColorStop(0,'#3b0a8f');g.addColorStop(.5,'#7c3aed');g.addColorStop(1,'#c084fc');x.strokeStyle=g;x.lineWidth=w;x.beginPath();x.arc(cx,cy,R,a0,a0+(a1-a0)*k);x.stroke()};arc(W*1.05,-H*.02,W*.55,Math.PI*.5,Math.PI*1.05,u*16);arc(-W*.08,H*1.04,W*.6,-Math.PI*.5,Math.PI*.05,u*18);x.restore()}
 if(sc.phone){const im=await load(sc.phone.src);const t0=sc.phone.at||0;if(lt>=t0&&im){const pk=back(rp(lt,t0,t0+.35)),pw=W*(sc.phone.w||.34),ph=pw*2.05;x.save();x.translate(W*(sc.phone.x||.82),H*(sc.phone.y||.48)+(1-pk)*H*.5);x.rotate(.08);x.shadowColor='rgba(0,0,0,.5)';x.shadowBlur=u*8;x.fillStyle='#0b0b10';rr(-pw/2,-ph/2,pw,ph,pw*.14);x.fill();x.shadowColor='transparent';rr(-pw/2+u*1.4,-ph/2+u*1.4,pw-u*2.8,ph-u*2.8,pw*.11);x.clip();cover(im,-pw/2,-ph/2,pw,ph,.45);x.restore()}}
 if(st!='plain')vignette(.5,.62);
 hideBurned(sc.hideY,sc.hideH);
 const ka=eo(rp(lt,0,.15)),kb=back(rp(lt,.05,.28));
 if(st=='signature'){if(sc.small)word(sc.small,W/2,Y-u*Math.max(12,(sc.size||16)*.8),u*6,{w:500,it:1,sh:1,a:ka});word(sc.big,W/2,Y,u*(sc.size||16),{w:900,it:1,sc:kb,grad:GR(),glow:'rgba(255,90,120,.55)',max:W*.92})}
 else if(st=='editorial'){if(sc.small)word(sc.small,W/2,Y-u*Math.max(11,(sc.size||15)*.78),u*5.5,{w:600,sh:1,a:ka});word(sc.big,W/2,Y,u*(sc.size||15),{w:900,col:C.brand.accent,sh:1,glow:C.brand.accent+'73',sc:kb,max:W*.92})}
 else if(st=='violet'){if(sc.small)pill(sc.small.toUpperCase(),W/2,Y-u*10.2,u*4.6,'#7c3aed','#fff',ka);word(sc.big,W/2,Y,u*(sc.size||16),{w:600,it:1,f:C.brand.display,grad:['#e9d5ff','#a855f7'],glow:'rgba(168,85,247,.7)',sc:kb,max:W*.94})}
 else if(st=='neon'){if(sc.small)word(sc.small,W/2,Y-u*12,u*6,{w:600,it:1,f:C.brand.display,col:'#fff',a:ka});const fl=lt<.3?(Math.sin(lt*90)>0?1:.3):1;word(sc.big,W/2,Y,u*(sc.size||18),{w:900,it:1,col:'#ff3b5c',glow:'rgba(255,40,80,.9)',a:fl,sc:kb,max:W*.92})}
 else {captions(t,sc);if(sc.big)word(sc.big,W/2,Y,u*(sc.size||12),{w:900,col:C.brand.primary,stroke:[u*.9,'#fff'],sh:1,sc:kb,max:W*.92})}
}

/* ---------- CUTAWAY (photo plein écran + mot) ---------- */
async function sceneCut(t,lt,sc){const im=await load(sc.src);const d=sc.t1-sc.t0,k=rp(lt,0,d);x.save();x.translate(W/2,H/2);const z=1.1-.1*k;x.scale(z,z);x.translate(-W/2,-H/2);cover(im,0,0,W,H,.5);x.restore();x.fillStyle='rgba(0,0,0,.22)';x.fillRect(0,0,W,H);
 if(sc.label)pill(sc.label,W/2,H*.12,u*4,C.brand.dark,'#fff',eo(rp(lt,0,.2)));word(sc.big,W/2,H*(sc.wy||.5),u*(sc.size||14),{w:800,sh:1,sc:back(rp(lt,0,.22)),max:W*.9})}

/* ---------- CARDS (explicatif, style agence) ---------- */
async function sceneCards(t,lt,sc){if(sc.theme)themeBG(sc,lt);else bg(sc.bg||'light');const B=C.brand,P=B.primary,D=B.dark;const items=sc.items||[];const st=i=>(sc.stagger||.18)*i+.12;
 if(sc.title)pill(sc.title,W/2,H*.14,u*4.2,D,'#fff',eo(rp(lt,0,.25)));
 const L=sc.layout;
 if(L=='checklist'||L=='steps'){const h=u*12,gap=u*4,Y0=H*.5-(items.length*(h+gap))/2;items.forEach((s,i)=>{const k=rp(lt,st(i),st(i)+.3);const y=Y0+i*(h+gap);if(card(W*.12,y,W*.76,h,k,{fill:L=='steps'?D:'#fff'})){const X=-W*.38+u*7;if(L=='steps'){x.fillStyle=P;x.beginPath();x.arc(X,0,u*3.6,0,7);x.fill();word(String(i+1).padStart(2,'0'),X,0,u*3.2,{w:800,col:'#fff'});word(s,-W*.38+u*14,0,u*4.2,{w:700,col:'#fff',al:'left',max:W*.56})}else{word(s,-W*.38+u*5,0,u*4.4,{w:700,col:D,al:'left',max:W*.55});check(W*.38-u*6,0,u*3,P,rp(lt,st(i)+.25,st(i)+.45))}endCard()}})}
 else if(L=='nodes'){const cx=W/2,cy=H*.5,R=W*.33,k0=eo(rp(lt,0,.3));x.save();x.strokeStyle=P+'66';x.lineWidth=u*.4;x.setLineDash([u*1.2,u*1.2]);x.beginPath();x.arc(cx,cy,R*k0,0,7);x.stroke();x.restore();
  if(card(cx-u*13,cy-u*9,u*26,u*18,k0,{fill:'#fff',stroke:P})){word(sc.center||'',0,0,u*4.6,{w:800,col:D,max:u*22});endCard()}
  items.forEach((s,i)=>{const a=-Math.PI/2+i*Math.PI*2/items.length,k=rp(lt,st(i)+.2,st(i)+.5),px=cx+Math.cos(a)*R,py=cy+Math.sin(a)*R;if(k<=0)return;x.save();x.globalAlpha=k;x.strokeStyle=P;x.lineWidth=u*.5;x.beginPath();x.moveTo(cx,cy);x.lineTo(lerp(cx,px,eo(k)),lerp(cy,py,eo(k)));x.stroke();x.restore();avatar(px,py,u*5.2*back(k),P);word(s,px,py+u*8.5,u*3.4,{w:700,col:D,a:k,max:u*24});if(sc.checked&&sc.checked.includes(i))check(px+u*4,py-u*4,u*2.2,P,rp(lt,st(i)+.5,st(i)+.7))})}
 else if(L=='counter'){const k=eo(rp(lt,.15,(sc.t1-sc.t0)*.7));const vals=items.length?items:[{label:'',value:100}];const n=vals.length,cw=W*.8/n;vals.forEach((v,i)=>{const X=W*.1+cw*i;if(card(X+u,H*.42,cw-u*2,u*30,rp(lt,st(i),st(i)+.3))){const val=Math.round((v.from||0)+((v.value||0)-(v.from||0))*k);word((v.prefix||'')+val.toLocaleString('fr-FR').replace(/ /g,' ')+(v.suffix||''),0,-u*3,u*(n>2?7:9),{w:900,col:P,max:cw-u*6});word(v.label||'',0,u*7.5,u*3.4,{w:600,col:'#5b6b62',max:cw-u*6});endCard()}})}
 else if(L=='product'){const im=await load(sc.src);const k=rp(lt,0,.35);if(card(W*.16,H*.26,W*.68,W*.92,k)){const cw=W*.68;x.save();rr(-cw/2+u*3,-W*.46+u*3,cw-u*6,W*.56,u*2.4);x.clip();cover(im,-cw/2+u*3,-W*.46+u*3,cw-u*6,W*.56,.5);x.restore();word(sc.name||'',-cw/2+u*4,W*.2,u*4.8,{w:800,col:D,al:'left',max:cw-u*8});word(sc.price||'',-cw/2+u*4,W*.28,u*5.6,{w:900,col:P,al:'left'});if(sc.tag)pill(sc.tag,cw/2-u*12,-W*.46+u*7,u*3,P,'#fff',1);endCard()}
